# lyra-debian build configuration — sourced by every script in scripts/.
# Edit here; nothing board- or distro-specific should be hardcoded elsewhere.

# ---------------------------------------------------------------- Debian rootfs
DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://deb.debian.org/debian-security"
DEBIAN_COMPONENTS="main contrib non-free-firmware"

HOSTNAME="lyra"
# Default login (created in both images; member of sudo). Root login is
# disabled entirely — use sudo from this account.
USER_NAME="lyra"
USER_PASSWORD="lyra"

# Base set: what both the SD and the (size-constrained) NAND variant get.
PKGS_BASE="systemd-sysv,udev,kmod,dbus,libpam-systemd,systemd-timesyncd,systemd-resolved,openssh-server,sudo,fake-hwclock,zram-tools,iproute2,iputils-ping,netbase,ca-certificates,less,nano,htop,gpiod"
# Extras for the SD image only (dev/debug comfort; NAND must stay < ~180 MiB).
PKGS_DEV="vim,curl,wget,i2c-tools,usbutils,evtest,file,psmisc,pciutils,mtd-utils,cloud-guest-utils,e2fsprogs"

# ------------------------------------------------------------------ SD image
# Root partition is sized automatically: rootfs content + this headroom. The
# partition grows to fill the real card on first boot (firstboot-resize), so
# this only sets the image/minimum-card size. Set SD_IMAGE_MB to a fixed total
# instead if you want a predictable image size.
ROOTFS_HEADROOM_MB=128
SD_IMAGE_MB=""
# Fixed layout (512-byte sectors) — proven by the Yocto wic build, do not change:
#   idbloader.img @ 64, u-boot.itb @ 16384, FAT boot @ 32768 (64 MiB), root @ 163840
SECTOR_IDBLOADER=64
SECTOR_UBOOT=16384
SECTOR_BOOT=32768
BOOT_PART_MB=64
SECTOR_ROOT=163840

# -------------------------------------------------------------------- Sources
# U-Boot is pinned to the commit proven by the Yocto build. Kernel and rkbin
# start at branch tips (resolved SHAs land in out/manifest.txt); paste those
# SHAs into the *_REF vars after the first verified boot to pin the build.
KERNEL_URL="https://github.com/rockchip-linux/kernel.git"
KERNEL_BRANCH="develop-6.1"
KERNEL_REF=""

UBOOT_URL="https://github.com/rockchip-linux/u-boot.git"
UBOOT_BRANCH="next-dev"
UBOOT_REF="b14196eade471bbc000c368f8555f2a2a1ecc17d"

RKBIN_URL="https://github.com/rockchip-linux/rkbin.git"
RKBIN_BRANCH="master"
RKBIN_REF=""

# ------------------------------------------------------------------- Toolchain
# Soft-float (armel) gcc: kernel + U-Boot are float-ABI-independent of the armhf
# userspace, and Debian's armhf gcc rejects U-Boot's bare -march=armv7-a probes.
CROSS_COMPILE="arm-linux-gnueabi-"
DTB_NAME="rk3506g-luckfox-lyra-plus.dtb"
DTB_NAME_NAND="rk3506g-luckfox-lyra-plus-nand.dtb"
RK3506_LOADER_INI="RKBOOT/RK3506MINIALL.ini"

# ------------------------------------------------------------------ SPI NAND
# Geometry of the onboard 256 MiB Winbond SPI NAND (from the Luckfox FAQ boot
# log): PEB (block) 128 KiB, page (min I/O) 2 KiB → LEB = 128K - 2*2K.
NAND_PEB_SIZE=131072
NAND_PAGE_SIZE=2048
NAND_LEB_SIZE=126976
# rootfs MTD partition: 0xDF60000 bytes @ 0x2000000 (parameter.txt) = 1787 PEBs.
NAND_ROOTFS_MAX_LEBS=1787
