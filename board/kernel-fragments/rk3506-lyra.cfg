# Extras on top of the vendor rk3506_defconfig for an SD-card ext4 rootfs.
# (rk3506-ethernet.config is merged separately by the recipe for GMAC/PHY.)
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# --- systemd kernel requirements ---------------------------------------------
# The vendor defconfig targets buildroot/sysvinit and lacks the cgroup/namespace
# support systemd needs (otherwise: "Failed to mount cgroup2 ... Failed to mount
# API filesystems"). Enable the systemd README "REQUIREMENTS" set.
CONFIG_CGROUPS=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_FHANDLE=y
CONFIG_AUTOFS_FS=y
CONFIG_AUTOFS4_FS=y
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_TMPFS_XATTR=y
CONFIG_INOTIFY_USER=y
CONFIG_SIGNALFD=y
CONFIG_TIMERFD=y
CONFIG_EVENTFD=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_HMAC=y
CONFIG_CRYPTO_SHA256=y

# --- USB core + DWC2 dual-role (OTG0 gadget, OTG1 host) ----------------------
# Base USB support. We drop the vendor rk3506-usb-peripheral.config (it pins
# dwc2 to PERIPHERAL-only, blocking the host port); DUAL_ROLE honours each
# port's dr_mode, so OTG0 stays a gadget and OTG1 can host the capture card.
CONFIG_USB=y
CONFIG_USB_COMMON=y
CONFIG_CONFIGFS_FS=y
CONFIG_PHY_ROCKCHIP_INNO_USB2=y
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_DUAL_ROLE=y
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_F_FS=y

# --- USB CDC-ECM + ACM gadget (USB-Ethernet) on OTG0 -------------------------
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_U_ETHER=y
CONFIG_USB_U_SERIAL=y

# --- USB host video capture (UVC) on OTG1 ------------------------------------
# USB Video Class — a UVC HDMI capture card shows up as /dev/videoN.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_USB_VIDEO_CLASS=y
CONFIG_USB_VIDEO_CLASS_INPUT_EVDEV=y

# USB mass storage on the host port (handy to have).
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y

# HDMI capture cards usually expose a USB audio endpoint too.
CONFIG_SND=y
CONFIG_SND_USB=y
CONFIG_SND_USB_AUDIO=y

# --- Common USB host-side drivers (all builtin; each is tiny) ---------------
# NB: scanners (e.g. ScanSnap iX500 via SANE) need none of these — SANE drives
# them from userspace over usbfs, which CONFIG_USB=y already provides.
# USB keyboards/mice (HID core+generic were already on, the usbhid transport wasn't).
CONFIG_USB_HID=y
# USB printers (usblp).
CONFIG_USB_PRINTER=y
# CDC-ACM host side (Arduinos, modems, USB-serial gadgets).
CONFIG_USB_ACM=y
# Common USB-serial adapters.
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_PL2303=y
CONFIG_USB_SERIAL_CH341=y
# usbmon — USB traffic capture, invaluable when debugging SANE/libusb devices.
CONFIG_USB_MON=y

# --- zram swap (128 MB RAM board; pairs with zram-tools in the rootfs) ------
# The vendor defconfig disables swap support entirely — turn the whole chain on.
CONFIG_SWAP=y
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=y
CONFIG_ZRAM_DEF_COMP_ZSTD=y

# --- POSIX ACLs on ext4 (journald sets ACLs on per-user journals) -----------
CONFIG_EXT4_FS_POSIX_ACL=y
CONFIG_EXT4_FS_SECURITY=y

# --- Userspace SPI (/dev/spidev*; i2c-dev + gpio cdev are already builtin) --
CONFIG_SPI_SPIDEV=y
